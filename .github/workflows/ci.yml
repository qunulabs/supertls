name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The l7proxy build tag is deliberately not run here: its tests drive a real
# inspecting proxy in a container and need docker. See README.md.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor is what the module claims to support, so it has to be tested.
        go: ['1.25', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Test with the race detector
        run: go test ./... -count=1 -short -race

  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build every supported target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "  $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
